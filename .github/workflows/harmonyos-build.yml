name: HarmonyOS Build

on:
  push:
    branches: [harmonyos-migration, main]
  pull_request:
    branches: [harmonyos-migration, main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: registry.cn-qingdao.aliyuncs.com/xuxiaoweicomcn/hmos-command:6.1.0.830

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup hvigor wrapper
        run: |
          # 使用 Docker 镜像自带的 hvigor-wrapper 生成项目 wrapper
          if [ ! -f hvigorw ]; then
            cp /opt/command-line-tools/bin/hvigorw ./hvigorw 2>/dev/null || true
          fi
          chmod +x hvigorw 2>/dev/null || true
          echo "=== hvigor version ==="
          hvigorw --version 2>&1 || echo "hvigorw not found, trying alternative..."

      - name: Build HAP (debug)
        run: |
          hvigorw assembleHap \
            -p buildMode=debug \
            -p module=entry@default \
            -p product=default \
            --no-daemon

      - name: Locate and upload HAP
        run: |
          echo "=== Searching for HAP ==="
          find . -name "*.hap" -type f 2>/dev/null || echo "No HAP found"
          echo "=== Build output tree ==="
          find entry/build -type f 2>/dev/null | head -50 || echo "No build output"

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCP-Bridge-HarmonyOS
          path: |
            entry/build/default/outputs/default/*.hap
            entry/build/**/outputs/**/*.hap